{% extends 'base.html' %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/happ.css') }}">
<div class="container-fluid pt-1 pb-3 h-dashboard-page" id="h-dashboard-page">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="h-dashboard-title">Home Collection Dashboard</h4>
    <div class="d-flex gap-2 hc-top-nav">
      <a class="btn btn-outline-primary btn-sm top-action-btn" href="/hhome-collection">Add Booking</a>
      <a class="btn btn-primary btn-sm top-action-btn" href="/hhome-collection/dashboard">All Booking</a>
      <a class="btn btn-outline-primary btn-sm top-action-btn" id="btn-go-assign-booking" href="/hhome-collection/assign-booking">Asgn Booking</a>
    </div>
  </div>

  <div class="card mb-3 dashboard-filter-card">
    <div class="card-body row g-2">
      <div class="col-md-2"><label class="form-label">From</label><input type="date" id="f-date-from" class="form-control"></div>
      <div class="col-md-2"><label class="form-label">To</label><input type="date" id="f-date-to" class="form-control"></div>
      <div class="col-md-2"><label class="form-label">Status</label><select id="f-status" class="form-select"><option value="">All</option><option value="0">Pending</option><option value="1">Assigned</option><option value="2">Started</option><option value="3">Completed</option><option value="4">Cancelled</option></select></div>
      <div class="col-md-2"><label class="form-label">Route</label><input id="f-route" class="form-control" placeholder="Route-5"></div>
      <div class="col-md-3"><label class="form-label">Booking/Mobile</label><input id="f-search" class="form-control" placeholder="HCB-000001 / 987..." ></div>
      <div class="col-md-1 d-flex align-items-end"><button class="btn btn-primary w-100" id="btn-filter">Go</button></div>
    </div>
  </div>

  <div class="card dashboard-table-card">
    <div class="table-responsive">
      <table class="table table-sm mb-0 dashboard-table" id="dashboard-table">
        <thead>
          <tr>
            <th>Sr. No.</th><th>Patient</th><th>Mobile</th><th>Visit Date</th><th>Time Slot</th>
            <th>Patients</th><th>Colony</th><th>Route</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div id="hd-page-loader" class="hd-page-loader">
  <div class="hd-loader-card">
    <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
    <div class="hd-loader-text">Loading All Booking...</div>
  </div>
</div>

<div class="modal fade" id="bookingModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Booking Detail</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="booking-modal-body"></div>
    <div class="modal-footer justify-content-end d-none" id="booking-modal-footer">
      <button type="button" class="btn btn-primary btn-sm" id="booking-modal-print-btn">Print Slip</button>
    </div>
  </div></div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/hassign_user_picker.js') }}"></script>
<script src="{{ url_for('static', filename='js/hdashboard.js') }}"></script>
{% endblock %}
